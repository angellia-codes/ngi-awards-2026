<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:
 radial-gradient(800px 600px at 10% -5%,rgba(212,175,55,.32),transparent 62%),
 radial-gradient(700px 600px at 105% 40%,rgba(168,132,31,.22),transparent 62%),
 radial-gradient(700px 500px at 50% 110%,rgba(212,175,55,.2),transparent 60%),#0a0a0b;
 color:#f5efe0;font-family:Inter,sans-serif;position:relative;overflow:hidden;text-align:center}
.frame{position:absolute;inset:34px;border:2px solid rgba(212,175,55,.55);border-radius:28px}
.frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(212,175,55,.25);border-radius:20px}
.wrap{position:absolute;inset:34px;padding:50px 60px;display:flex;flex-direction:column;align-items:center}
.star{font-size:44px;color:#d4af37}
.eyebrow{font-family:Cinzel,serif;font-weight:500;letter-spacing:.4em;font-size:26px;color:#f2d675;margin-top:10px}
h1{font-family:Cinzel,serif;font-weight:900;font-size:100px;line-height:1.02;letter-spacing:.05em;margin-top:22px;
 background:linear-gradient(135deg,#f2d675,#d4af37 50%,#a8841f);-webkit-background-clip:text;color:transparent}
.year{font-family:Cinzel,serif;font-weight:700;font-size:44px;letter-spacing:.5em;color:#f2d675;margin-top:8px;padding-left:.5em}
.rule{width:140px;height:3px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:24px 0}
.lead{font-size:38px;font-weight:600;line-height:1.3}
.lead small{display:block;font-size:27px;font-weight:400;color:#bdb298;margin-top:8px;font-style:italic}
.qr{margin-top:36px;padding:26px;border-radius:30px;background:rgba(255,255,255,.07);border:1.5px solid rgba(212,175,55,.5);
 box-shadow:0 0 60px rgba(212,175,55,.3)}
.qr div{background:#fff;padding:20px;border-radius:16px}
.qr img{display:block;width:430px;height:430px}
.scan{font-family:Cinzel,serif;font-weight:700;letter-spacing:.25em;font-size:32px;color:#f2d675;margin-top:26px;white-space:nowrap}
.steps{margin-top:14px;font-size:25px;color:#bdb298;line-height:1.5}
.steps b{color:#f5efe0;font-weight:600}
</style></head><body>
<div class="frame"></div>
<div class="wrap">
 <div class="star">✦</div>
 <div class="eyebrow">THE</div>
 <h1>NOURISH<br>AWARDS</h1>
 <div class="year">2026</div>
 <div class="rule"></div>
 <div class="lead">HODs, it's time to vote!</div>
 <div class="qr"><div><img src="nourish-awards-qr.png"></div></div>
 <div class="scan">SCAN TO VOTE</div>
 <div class="steps">Choose your name and sign in with the <b>6-digit PIN</b> from HR.</div>
</div></body></html>
